<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>All Projects — Long Nguyen</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    :root{--accent:#e8872a;--accent-dim:#9b5a18;--accent-glow:rgba(232,135,42,0.13);--bg:#0c0c0e;--surface:#131316;--surface-2:#1a1a1f;--border:#222228;--border-light:#2e2e38;--text:#e8e6e0;--text-muted:#6b6a72;--text-dim:#9998a3;--radius:6px;--radius-lg:12px;--font-display:'Syne',sans-serif;--font-body:'Inter',sans-serif;}
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    html{scroll-behavior:smooth;}
    body{background:var(--bg);color:var(--text);font-family:var(--font-body);font-weight:300;line-height:1.7;overflow-x:hidden;cursor:none;}
    ::-webkit-scrollbar{width:4px;}::-webkit-scrollbar-track{background:var(--bg);}::-webkit-scrollbar-thumb{background:var(--accent-dim);border-radius:2px;}
    #cursor{position:fixed;z-index:9999;pointer-events:none;width:10px;height:10px;border-radius:50%;background:var(--accent);mix-blend-mode:screen;transform:translate(-50%,-50%);transition:width .2s,height .2s;}
    #cursor-ring{position:fixed;z-index:9998;pointer-events:none;width:32px;height:32px;border-radius:50%;border:1px solid rgba(232,135,42,0.4);transform:translate(-50%,-50%);}
    a,button{cursor:none;}
    #wave-canvas{position:fixed;inset:0;z-index:0;pointer-events:none;}
    #vignette{position:fixed;inset:0;z-index:0;pointer-events:none;background:linear-gradient(to bottom,#0c0c0e 0%,transparent 14%,transparent 86%,#0c0c0e 100%),linear-gradient(to right,#0c0c0e 0%,transparent 8%,transparent 92%,#0c0c0e 100%);}
    #wave-dimmer{position:fixed;inset:0;z-index:0;pointer-events:none;background:rgba(12,12,14,0.75);}
    nav,main,footer{position:relative;z-index:2;}
    nav{position:fixed;top:0;left:0;right:0;z-index:100;display:flex;justify-content:space-between;align-items:center;padding:1rem 3rem;background:rgba(12,12,14,0.88);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border-bottom:1px solid var(--border);}
    .nav-logo{font-family:var(--font-display);font-weight:800;font-size:1rem;letter-spacing:.04em;text-decoration:none;color:var(--text);}
    .nav-logo span{color:var(--accent);}
    .nav-links{display:flex;gap:.2rem;align-items:center;}
    .nav-links a{padding:.4rem .9rem;font-size:.78rem;font-weight:400;letter-spacing:.05em;text-decoration:none;color:var(--text-muted);border-radius:var(--radius);transition:color .2s,background .2s;}
    .nav-links a:hover{color:var(--text);background:var(--surface-2);}
    .nav-back{border:1px solid var(--accent-dim)!important;color:var(--accent)!important;}
    .nav-back:hover{background:var(--accent-glow)!important;}
    main{padding-top:72px;}
    .wrap{max-width:1160px;margin:0 auto;padding:0 2.5rem;}
    .page-header{padding:4rem 0 2.5rem;border-bottom:1px solid var(--border);}
    .page-eyebrow{display:inline-flex;align-items:center;gap:.6rem;font-size:.73rem;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin-bottom:1rem;}
    .page-eyebrow::before{content:'';width:24px;height:1.5px;background:var(--accent);}
    .page-header h1{font-family:var(--font-display);font-weight:800;font-size:clamp(2.2rem,5vw,4rem);line-height:1;letter-spacing:-.03em;margin-bottom:.8rem;}
    .page-header p{color:var(--text-dim);font-size:.95rem;max-width:480px;line-height:1.8;}
    .tab-bar{display:flex;gap:0;padding:1.8rem 0;border-bottom:1px solid var(--border);}
    .tab-btn{padding:.65rem 1.6rem;font-family:var(--font-display);font-size:.82rem;font-weight:700;letter-spacing:.04em;border:1px solid var(--border-light);background:transparent;color:var(--text-muted);border-radius:var(--radius) 0 0 var(--radius);transition:all .2s;cursor:none;}
    .tab-btn:last-child{border-left:none;border-radius:0 var(--radius) var(--radius) 0;}
    .tab-btn.active{background:var(--accent);border-color:var(--accent);color:#000;}
    .tab-btn:hover:not(.active){color:var(--text);border-color:var(--border-light);background:var(--surface-2);}
    .tab-panel{display:none;padding:2.5rem 0;}
    .tab-panel.active{display:block;}
    .proj-list{display:flex;flex-direction:column;gap:2px;}
    .proj-item{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden;transition:border-color .2s;}
    .proj-item:hover{border-color:var(--border-light);}
    .proj-item.open{border-color:var(--accent-dim);}
    .proj-hdr{display:grid;grid-template-columns:46px 1fr auto auto;align-items:center;gap:1.4rem;padding:1.3rem 1.6rem;cursor:none;}
    .proj-num{font-family:var(--font-display);font-size:.68rem;font-weight:700;color:var(--accent-dim);letter-spacing:.1em;text-align:center;}
    .proj-hdr h3{font-family:var(--font-display);font-size:1rem;font-weight:700;color:var(--text);margin-bottom:.15rem;}
    .proj-tagline{font-size:.75rem;color:var(--text-muted);}
    .tag-row{display:flex;gap:.35rem;flex-wrap:wrap;}
    .tpill{padding:.2rem .65rem;border-radius:99px;font-size:.65rem;font-weight:500;background:var(--surface-2);border:1px solid var(--border-light);color:var(--text-muted);}
    .proj-toggle{width:26px;height:26px;border-radius:50%;background:var(--surface-2);border:1px solid var(--border-light);display:flex;align-items:center;justify-content:center;color:var(--text-muted);font-size:1.1rem;flex-shrink:0;transition:background .2s,transform .3s,color .2s;}
    .proj-item.open .proj-toggle{background:var(--accent-glow);border-color:var(--accent-dim);color:var(--accent);transform:rotate(45deg);}
    .proj-docs{display:none;border-top:1px solid var(--border);}
    .proj-item.open .proj-docs{display:block;}
    .docs-grid{display:grid;grid-template-columns:1fr 1fr;}
    .doc-panel{padding:1.8rem 1.6rem;border-right:1px solid var(--border);}
    .doc-panel:last-child{border-right:none;}
    .doc-panel:nth-child(n+3){border-top:1px solid var(--border);}
    .doc-title{font-size:.65rem;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin-bottom:.9rem;}
    .doc-panel p{font-size:.83rem;color:var(--text-dim);line-height:1.8;}
    .spec-list{list-style:none;}
    .spec-list li{display:flex;justify-content:space-between;font-size:.8rem;padding:.4rem 0;border-bottom:1px solid var(--border);color:var(--text-dim);}
    .spec-list li:last-child{border-bottom:none;}
    .spec-list span{color:var(--text);}
    .outcomes{display:flex;flex-direction:column;gap:.5rem;}
    .outcome{display:flex;gap:.7rem;font-size:.8rem;color:var(--text-dim);line-height:1.6;}
    .outcome::before{content:'arrow';content:'arrow';content:'→';color:var(--accent);flex-shrink:0;}
    .doc-links{display:flex;flex-direction:column;gap:.5rem;}
    .dlink{display:inline-flex;align-items:center;gap:.5rem;font-size:.78rem;color:var(--text-muted);text-decoration:none;padding:.5rem .9rem;border-radius:var(--radius);border:1px solid var(--border-light);background:var(--surface-2);transition:border-color .2s,color .2s;}
    .dlink:hover{border-color:var(--accent-dim);color:var(--accent);}
    .filter-bar{display:flex;gap:.5rem;flex-wrap:wrap;margin-bottom:2rem;}
    .filter-btn{padding:.4rem 1rem;border-radius:99px;font-size:.72rem;font-weight:500;border:1px solid var(--border-light);background:transparent;color:var(--text-muted);transition:all .2s;cursor:none;}
    .filter-btn:hover{border-color:var(--accent-dim);color:var(--accent);}
    .filter-btn.active{background:var(--accent-glow);border-color:var(--accent-dim);color:var(--accent);}
    .mini-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem;}
    .mini-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:1.6rem;transition:border-color .2s,transform .2s;}
    .mini-card:hover{border-color:var(--accent-dim);transform:translateY(-3px);}
    .mini-card[data-hidden="true"]{display:none;}
    .mini-cat{font-size:.65rem;font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);margin-bottom:.7rem;}
    .mini-card h3{font-family:var(--font-display);font-size:.95rem;font-weight:700;color:var(--text);margin-bottom:.5rem;line-height:1.3;}
    .mini-card p{font-size:.8rem;color:var(--text-dim);line-height:1.7;margin-bottom:1rem;}
    .mini-tags{display:flex;flex-wrap:wrap;gap:.35rem;}
    .mini-tag{padding:.2rem .6rem;border-radius:99px;font-size:.62rem;font-weight:500;background:var(--surface-2);border:1px solid var(--border);color:var(--text-muted);}
    .mini-links{margin-top:1rem;display:flex;gap:.4rem;}
    .mini-link{padding:.35rem .8rem;border-radius:var(--radius);font-size:.7rem;border:1px solid var(--border-light);color:var(--text-muted);text-decoration:none;transition:border-color .2s,color .2s;}
    .mini-link:hover{border-color:var(--accent-dim);color:var(--accent);}
    footer{border-top:1px solid var(--border);padding:1.8rem 2.5rem;max-width:1160px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;font-size:.72rem;color:var(--text-muted);}
    footer a{color:var(--text-muted);text-decoration:none;}footer a:hover{color:var(--accent);}
    .rv{opacity:0;transform:translateY(16px);transition:opacity .5s ease,transform .5s ease;}.rv.on{opacity:1;transform:none;}
    @media(max-width:900px){
      nav{padding:1rem 1.5rem;}.wrap{padding:0 1.5rem;}
      .mini-grid{grid-template-columns:1fr;}
      .docs-grid{grid-template-columns:1fr;}
      .doc-panel{border-right:none!important;}
      .doc-panel:nth-child(n+2){border-top:1px solid var(--border);}
      .proj-hdr{grid-template-columns:40px 1fr auto;}
      .tag-row{display:none;}
      footer{flex-direction:column;gap:.5rem;text-align:center;}
      body{cursor:auto;}#cursor,#cursor-ring{display:none;}
    }
  </style>
</head>

<script>
(function(){
  const canvas=document.getElementById('wave-canvas');
  const gl=canvas.getContext('webgl',{antialias:true,alpha:true});
  if(!gl){canvas.style.display='none';return;}
  const COLS=80,ROWS=50,MAX_RIPPLES=6,ripples=[];
  let rawMx=0,rawMy=0,smMx=0,smMy=0;
  function resize(){canvas.width=window.innerWidth;canvas.height=window.innerHeight;gl.viewport(0,0,canvas.width,canvas.height);}
  window.addEventListener('resize',resize,{passive:true});resize();
  const vsrc=`precision mediump float;attribute vec2 aPos;uniform float uTime;uniform float uAspect;uniform vec2 uRipple0;uniform float uRippleT0;uniform float uRippleA0;uniform vec2 uRipple1;uniform float uRippleT1;uniform float uRippleA1;uniform vec2 uRipple2;uniform float uRippleT2;uniform float uRippleA2;uniform vec2 uRipple3;uniform float uRippleT3;uniform float uRippleA3;uniform vec2 uRipple4;uniform float uRippleT4;uniform float uRippleA4;uniform vec2 uRipple5;uniform float uRippleT5;uniform float uRippleA5;uniform vec2 uMouse;varying float vHeight;varying float vDepth;float ripple(vec2 pos,vec2 center,float rt,float amp){float d=distance(pos,center);float wave=sin(d*18.0-rt*2.2)*exp(-d*3.5)*exp(-rt*0.5);return wave*amp;}void main(){vec2 p=aPos;float px=p.x;float pz=p.y;float h=0.0;h+=0.055*sin(px*2.8+uTime*0.28+pz*1.2);h+=0.038*sin(px*5.1-uTime*0.38+pz*2.5);h+=0.028*sin(px*2.0+uTime*0.18-pz*2.8);h+=0.018*cos(px*6.5+uTime*0.50+pz*0.8);h+=0.014*sin(px*9.2-uTime*0.65-pz*1.6);float md=distance(p,uMouse);h+=0.06*exp(-md*md*8.0);h+=ripple(p,uRipple0,uRippleT0,uRippleA0);h+=ripple(p,uRipple1,uRippleT1,uRippleA1);h+=ripple(p,uRipple2,uRippleT2,uRippleA2);h+=ripple(p,uRipple3,uRippleT3,uRippleA3);h+=ripple(p,uRipple4,uRippleT4,uRippleA4);h+=ripple(p,uRipple5,uRippleT5,uRippleA5);vHeight=h;float eyeZ=1.6;float wz=eyeZ-pz*0.32;float projX=(px*eyeZ)/wz;float projY=(pz*eyeZ+h*wz)/wz;vDepth=(pz+1.0)*0.5;gl_Position=vec4(projX,projY,0.0,1.0);}`;
  const fsrc=`precision mediump float;varying float vHeight;varying float vDepth;void main(){float bright=clamp(0.08+vHeight*3.5+0.04,0.0,1.0);float alpha=bright*(0.15+vDepth*0.85)*0.65;gl_FragColor=vec4(0.91,0.53,0.16,alpha);}`;
  function compile(t,s){const sh=gl.createShader(t);gl.shaderSource(sh,s);gl.compileShader(sh);return sh;}
  const prog=gl.createProgram();gl.attachShader(prog,compile(gl.VERTEX_SHADER,vsrc));gl.attachShader(prog,compile(gl.FRAGMENT_SHADER,fsrc));gl.linkProgram(prog);gl.useProgram(prog);
  const N=COLS*ROWS,pos=new Float32Array(N*2);
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){const i=(r*COLS+c)*2;pos[i]=(c/(COLS-1))*2-1;pos[i+1]=(r/(ROWS-1))*2-1;}
  const lh=[],lv=[];
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS-1;c++)lh.push(r*COLS+c,r*COLS+c+1);
  for(let r=0;r<ROWS-1;r++)for(let c=0;c<COLS;c++)lv.push(r*COLS+c,(r+1)*COLS+c);
  const lidx=new Uint16Array([...lh,...lv]);
  const vbo=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,vbo);gl.bufferData(gl.ARRAY_BUFFER,pos,gl.STATIC_DRAW);
  const ibo=gl.createBuffer();gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,ibo);gl.bufferData(gl.ELEMENT_ARRAY_BUFFER,lidx,gl.STATIC_DRAW);
  const ap=gl.getAttribLocation(prog,'aPos');gl.enableVertexAttribArray(ap);gl.vertexAttribPointer(ap,2,gl.FLOAT,false,0,0);
  const uTime=gl.getUniformLocation(prog,'uTime'),uAspect=gl.getUniformLocation(prog,'uAspect'),uMouse=gl.getUniformLocation(prog,'uMouse');
  const rU=[];for(let i=0;i<MAX_RIPPLES;i++)rU.push({pos:gl.getUniformLocation(prog,`uRipple${i}`),t:gl.getUniformLocation(prog,`uRippleT${i}`),a:gl.getUniformLocation(prog,`uRippleA${i}`)});
  gl.enable(gl.BLEND);gl.blendFunc(gl.SRC_ALPHA,gl.ONE);
  const t0=performance.now();
  function frame(now){
    const e=(now-t0)*0.001;
    smMx+=(rawMx-smMx)*0.055;smMy+=(rawMy-smMy)*0.055;
    for(let i=ripples.length-1;i>=0;i--){ripples[i].t+=0.016;if(ripples[i].t>4.5)ripples.splice(i,1);}
    gl.clearColor(0,0,0,0);gl.clear(gl.COLOR_BUFFER_BIT);
    gl.uniform1f(uTime,e);gl.uniform1f(uAspect,canvas.width/canvas.height);gl.uniform2f(uMouse,smMx,smMy);
    for(let i=0;i<MAX_RIPPLES;i++){const r=ripples[i];if(r){gl.uniform2f(rU[i].pos,r.x,r.y);gl.uniform1f(rU[i].t,r.t);gl.uniform1f(rU[i].a,r.a);}else{gl.uniform2f(rU[i].pos,9,9);gl.uniform1f(rU[i].t,99);gl.uniform1f(rU[i].a,0);}}
    gl.drawElements(gl.LINES,lidx.length,gl.UNSIGNED_SHORT,0);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
  function toNDC(ex,ey){return[(ex/canvas.width)*2-1,-((ey/canvas.height)*2-1)];}
  window.addEventListener('mousemove',e=>{[rawMx,rawMy]=toNDC(e.clientX,e.clientY);},{passive:true});
  function spawn(){const nx=(Math.random()*1.6)-.8,ny=(Math.random()*1.6)-.8;if(ripples.length>=MAX_RIPPLES)ripples.shift();ripples.push({x:nx,y:ny,t:0,a:.14+Math.random()*.18});setTimeout(spawn,4000+Math.random()*1000);}
  setTimeout(spawn,800);setTimeout(spawn,2800);setTimeout(spawn,4500);
})();

(function(){
  const cur=document.getElementById('cursor'),ring=document.getElementById('cursor-ring');
  let cx=0,cy=0,rx=0,ry=0;
  document.addEventListener('mousemove',e=>{cx=e.clientX;cy=e.clientY;},{passive:true});
  function a(){rx+=(cx-rx)*.12;ry+=(cy-ry)*.12;cur.style.left=cx+'px';cur.style.top=cy+'px';ring.style.left=rx+'px';ring.style.top=ry+'px';requestAnimationFrame(a);}a();
  document.querySelectorAll('a,button').forEach(el=>{
    el.addEventListener('mouseenter',()=>{cur.style.width='18px';cur.style.height='18px';ring.style.transform='translate(-50%,-50%) scale(1.4)';});
    el.addEventListener('mouseleave',()=>{cur.style.width='10px';cur.style.height='10px';ring.style.transform='translate(-50%,-50%) scale(1)';});
  });
})();

function mkEl(t,c,h){const e=document.createElement(t);if(c)e.className=c;if(h!==undefined)e.innerHTML=h;return e;}
document.getElementById('nav-logo-el').innerHTML=`${ME.nameShort}<span style="color:var(--accent)">.</span>`;
document.getElementById('footer-el').innerHTML=`<span>&copy; 2026 ${ME.name} &mdash; Mechanical &amp; Robotics Engineering</span><span>${ME.location} &middot; <a href="mailto:${ME.email}">${ME.email}</a></span>`;

const pl=document.getElementById('proj-list');
ME.projects.forEach(p=>{
  const item=mkEl('div','proj-item rv');
  const tH=p.tags.map(t=>`<span class="tpill">${t}</span>`).join('');
  const sH=p.specs.map(([k,v])=>`<li>${k} <span>${v}</span></li>`).join('');
  const oH=p.outcomes.map(o=>`<div class="outcome">${o}</div>`).join('');
  const lH=p.links.map(l=>`<a href="${l.url}" class="dlink">${l.icon} ${l.label}</a>`).join('');
  item.innerHTML=`<div class="proj-hdr" onclick="toggleProj(this)"><div class="proj-num">${p.num}</div><div><h3>${p.title}</h3><div class="proj-tagline">${p.tagline}</div></div><div class="tag-row">${tH}</div><div class="proj-toggle">+</div></div><div class="proj-docs"><div class="docs-grid"><div class="doc-panel"><div class="doc-title">Overview</div><p>${p.overview}</p></div><div class="doc-panel"><div class="doc-title">Technical Specs</div><ul class="spec-list">${sH}</ul></div><div class="doc-panel"><div class="doc-title">Outcomes</div><div class="outcomes">${oH}</div></div><div class="doc-panel"><div class="doc-title">Links</div><div class="doc-links">${lH}</div></div></div></div>`;
  pl.appendChild(item);
});

const cats=['All',...new Set(ME.miniProjects.map(p=>p.cat))];
const fb=document.getElementById('filter-bar');
cats.forEach(cat=>{
  const btn=mkEl('button','filter-btn'+(cat==='All'?' active':''),cat);
  btn.onclick=()=>{document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));btn.classList.add('active');document.querySelectorAll('.mini-card').forEach(c=>{c.dataset.hidden=(cat!=='All'&&c.dataset.cat!==cat)?'true':'false';});};
  fb.appendChild(btn);
});
const grid=document.getElementById('mini-grid');
ME.miniProjects.forEach(m=>{
  const tH=m.tags.map(t=>`<span class="mini-tag">${t}</span>`).join('');
  const lH=(m.links||[]).map(l=>`<a href="${l.url}" class="mini-link">${l.label} &uarr;</a>`).join('');
  const card=mkEl('div','mini-card rv');card.dataset.cat=m.cat;card.dataset.hidden='false';
  card.innerHTML=`<div class="mini-cat">${m.cat}</div><h3>${m.title}</h3><p>${m.desc}</p><div class="mini-tags">${tH}</div>${lH?`<div class="mini-links">${lH}</div>`:''}`;
  grid.appendChild(card);
});

function switchTab(id,btn){document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));document.querySelectorAll('.tab-panel').forEach(p=>p.classList.remove('active'));btn.classList.add('active');document.getElementById('panel-'+id).classList.add('active');}
function toggleProj(hdr){const item=hdr.closest('.proj-item');const open=item.classList.contains('open');document.querySelectorAll('.proj-item').forEach(p=>p.classList.remove('open'));if(!open)item.classList.add('open');}
const obs=new IntersectionObserver(e=>{e.forEach(e=>{if(e.isIntersecting)e.target.classList.add('on');});},{threshold:.07});
document.querySelectorAll('.rv').forEach(el=>obs.observe(el));
setTimeout(()=>document.querySelector('.page-header')?.classList.add('on'),100);
</script>
</body>
</html>
